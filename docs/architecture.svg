<svg viewBox="0 0 980 740" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>FHIR Forms presentation-layer architecture</title>
  <desc>A Questionnaire generates and lints an arbitrary HTML form. The form posts canonical paths. Questionnaire and POST body are collected and validated together to produce a JSON QuestionnaireResponse.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3faf7"/>
      <stop offset="1" stop-color="#fff6e8"/>
    </linearGradient>
    <linearGradient id="form-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5df"/>
      <stop offset="1" stop-color="#ffebe5"/>
    </linearGradient>
    <linearGradient id="response-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173c32"/>
      <stop offset="1" stop-color="#225e50"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173c32" flood-opacity=".11"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#238c7d" opacity=".09"/>
    </pattern>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#238c7d"/>
    </marker>
    <marker id="coral-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#d96d55"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="978" height="738" rx="28" fill="url(#canvas)" stroke="#d7e3dd"/>
  <rect x="1" y="1" width="978" height="738" rx="28" fill="url(#dots)"/>

  <text x="50" y="34" fill="#68736f" font-size="10" font-weight="700" letter-spacing="1.6" font-family="IBM Plex Mono, monospace">1 / DEFINITION AND PRESENTATION</text>

  <g filter="url(#shadow)">
    <rect x="50" y="52" width="310" height="190" rx="22" fill="#fff" stroke="#b9d9d0"/>
    <rect x="50" y="52" width="310" height="50" rx="22" fill="#238c7d"/>
    <path d="M50 80h310v22H50z" fill="#238c7d"/>
    <text x="74" y="84" fill="#fff" font-size="18" font-weight="750" font-family="Instrument Sans, sans-serif">Questionnaire</text>
    <text x="74" y="127" fill="#68736f" font-size="9" font-weight="700" letter-spacing="1.4" font-family="IBM Plex Mono, monospace">SEMANTIC DEFINITION</text>
    <g font-family="IBM Plex Mono, monospace" font-size="12">
      <text x="74" y="157" fill="#238c7d">linkId</text><text x="126" y="157" fill="#173c32">: weight</text>
      <text x="74" y="183" fill="#238c7d">type</text><text x="113" y="183" fill="#173c32">: quantity</text>
      <text x="74" y="209" fill="#238c7d">required</text><text x="139" y="209" fill="#173c32">: true</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="620" y="52" width="310" height="190" rx="22" fill="url(#form-card)" stroke="#efc9b8"/>
    <text x="644" y="84" fill="#a34d39" font-size="9" font-weight="700" letter-spacing="1.4" font-family="IBM Plex Mono, monospace">PRESENTATION</text>
    <text x="644" y="112" fill="#173c32" font-size="20" font-weight="750" font-family="Instrument Sans, sans-serif">Arbitrary HTML form</text>
    <rect x="644" y="132" width="262" height="50" rx="10" fill="#fff" stroke="#ead7ca"/>
    <text x="658" y="149" fill="#68736f" font-size="8" font-weight="700" letter-spacing="1" font-family="IBM Plex Mono, monospace">WEIGHT</text>
    <text x="658" y="172" fill="#173c32" font-size="16" font-weight="750" font-family="Instrument Sans, sans-serif">70</text>
    <rect x="824" y="141" width="68" height="31" rx="7" fill="#e1f1ec"/>
    <text x="848" y="161" fill="#176b5e" font-size="11" font-weight="700" font-family="Instrument Sans, sans-serif">kg</text>
    <text x="644" y="215" fill="#8a675b" font-size="10" font-family="IBM Plex Mono, monospace">any layout / widget / runtime</text>
  </g>

  <path d="M372 103H607" stroke="#238c7d" stroke-width="3" marker-end="url(#teal-arrow)"/>
  <rect x="437" y="79" width="106" height="28" rx="14" fill="#e1f1ec"/>
  <text x="490" y="97" text-anchor="middle" fill="#176b5e" font-size="10" font-weight="700" letter-spacing=".8" font-family="IBM Plex Mono, monospace">GENERATOR</text>

  <path d="M608 208H373" stroke="#d96d55" stroke-width="3" marker-end="url(#coral-arrow)"/>
  <rect x="445" y="204" width="90" height="28" rx="14" fill="#ffebe5"/>
  <text x="490" y="222" text-anchor="middle" fill="#a34d39" font-size="10" font-weight="700" letter-spacing=".8" font-family="IBM Plex Mono, monospace">LINTER</text>

  <text x="50" y="286" fill="#68736f" font-size="10" font-weight="700" letter-spacing="1.6" font-family="IBM Plex Mono, monospace">2 / QUESTIONNAIRE + HTTP BODY</text>

  <path d="M775 248v44" stroke="#d96d55" stroke-width="3" marker-end="url(#coral-arrow)"/>
  <g filter="url(#shadow)">
    <rect x="552" y="298" width="378" height="145" rx="20" fill="#fff" stroke="#efc9b8"/>
    <rect x="552" y="298" width="378" height="36" rx="20" fill="#ffebe5"/>
    <path d="M552 318h378v16H552z" fill="#ffebe5"/>
    <text x="574" y="322" fill="#a34d39" font-size="10" font-weight="700" letter-spacing="1.2" font-family="IBM Plex Mono, monospace">HTTP POST /responses</text>
    <g font-family="IBM Plex Mono, monospace">
      <text x="574" y="355" fill="#a34d39" font-size="9.5">questionnaire</text><text x="654" y="355" fill="#173c32" font-size="9.5">= https://example.org/Questionnaire/vitals|1.0.0</text>
      <text x="574" y="382" fill="#238c7d" font-size="12">item[weight].value</text><text x="738" y="382" fill="#173c32" font-size="12">= 70</text>
      <text x="574" y="409" fill="#238c7d" font-size="12">item[weight].unit</text><text x="731" y="409" fill="#173c32" font-size="12">= kg</text>
    </g>
    <text x="574" y="431" fill="#68736f" font-size="9" font-family="IBM Plex Mono, monospace">host context + ordered answer entry list</text>
  </g>

  <path d="M205 248v176 C205 446 352 442 431 459" fill="none" stroke="#238c7d" stroke-width="2.8" marker-end="url(#teal-arrow)"/>
  <text x="220" y="392" fill="#176b5e" font-size="10" font-weight="700" font-family="IBM Plex Mono, monospace">definition</text>

  <path d="M741 449 C741 459 625 450 549 462" fill="none" stroke="#d96d55" stroke-width="2.8" marker-end="url(#coral-arrow)"/>
  <text x="689" y="465" fill="#a34d39" font-size="10" font-weight="700" font-family="IBM Plex Mono, monospace">entries</text>

  <circle cx="490" cy="470" r="42" fill="#fff" stroke="#8dbab0" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="490" y="465" text-anchor="middle" fill="#173c32" font-size="12" font-weight="750" font-family="Instrument Sans, sans-serif">collect</text>
  <text x="490" y="484" text-anchor="middle" fill="#173c32" font-size="12" font-weight="750" font-family="Instrument Sans, sans-serif">+ validate</text>

  <text x="50" y="527" fill="#68736f" font-size="10" font-weight="700" letter-spacing="1.6" font-family="IBM Plex Mono, monospace">3 / TYPED RESULT</text>
  <path d="M490 513v17" stroke="#238c7d" stroke-width="3" marker-end="url(#teal-arrow)"/>

  <g filter="url(#shadow)">
    <rect x="335" y="536" width="310" height="190" rx="22" fill="#fff" stroke="#b9d9d0"/>
    <rect x="335" y="536" width="310" height="50" rx="22" fill="#238c7d"/>
    <path d="M335 564h310v22H335z" fill="#238c7d"/>
    <text x="359" y="568" fill="#fff" font-size="18" font-weight="750" font-family="Instrument Sans, sans-serif">QuestionnaireResponse</text>
    <text x="359" y="610" fill="#68736f" font-size="9" font-weight="700" letter-spacing="1.4" font-family="IBM Plex Mono, monospace">TYPED RESULT</text>
    <g font-family="IBM Plex Mono, monospace" font-size="12">
      <text x="359" y="635" fill="#238c7d">item:</text>
      <text x="375" y="651" fill="#173c32">- </text><text x="389" y="651" fill="#238c7d">linkId:</text><text x="441" y="651" fill="#173c32"> weight</text>
      <text x="391" y="667" fill="#238c7d">answer:</text>
      <text x="407" y="683" fill="#173c32">- </text><text x="421" y="683" fill="#238c7d">valueQuantity:</text>
      <text x="437" y="699" fill="#238c7d">value:</text><text x="480" y="699" fill="#173c32"> 70</text>
      <text x="437" y="715" fill="#238c7d">unit:</text><text x="474" y="715" fill="#173c32"> kg</text>
    </g>
  </g>
</svg>
